<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>parcel</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #050508;
    --panel-bg: rgba(14, 15, 22, 0.84);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #f3f4f8;
    --muted: #9aa0b4;
    --accent: #7c5cff;
    --accent-2: #ff3b8d;
    --danger: #ff4757;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 50%, #10121d 0%, #040407 100%);
    overflow: hidden;
  }

  #frame {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 70px rgba(0, 0, 0, 0.85);
    transition: width 0.25s ease, height 0.25s ease;
  }

  canvas#fluid {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    background: #000;
  }

  #reopenBtn {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    background: var(--panel-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  #reopenBtn.visible { display: flex; }

  #ctl {
    position: fixed;
    left: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    width: min(310px, calc(100vw - 32px));
    max-height: calc(100dvh - 32px - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65);
  }
  #ctl.collapsed { display: none; }

  .ctl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .ctl-title {
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    box-shadow: 0 0 10px var(--accent-2);
  }
  .icon-btn {
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border-radius: 8px;
    padding: 4px 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.14); }

  .section {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .section-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 700;
  }

  .row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .seg-btn {
    flex: 1;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.04);
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }
  .seg-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.09); }
  .seg-btn.active {
    color: #fff;
    border-color: rgba(124, 92, 255, 0.7);
    background: linear-gradient(135deg, rgba(124, 92, 255, 0.35), rgba(255, 59, 141, 0.25));
  }

  .action-btn {
    flex: 1;
    padding: 7px 10px;
    border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .action-btn:hover { background: rgba(255, 255, 255, 0.15); }

  .rec-btn {
    width: 100%;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 71, 87, 0.45);
    background: linear-gradient(135deg, rgba(255, 71, 87, 0.25), rgba(255, 59, 141, 0.18));
    color: #fff;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .rec-btn:hover { filter: brightness(1.12); }
  .rec-btn.recording {
    background: var(--danger);
    border-color: var(--danger);
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.55); }
    50% { box-shadow: 0 0 0 8px rgba(255, 71, 87, 0); }
  }

  .ctl-slider {
    display: grid;
    grid-template-columns: 78px 1fr 38px;
    gap: 8px;
    align-items: center;
  }
  .ctl-slider span:last-child {
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }
  select.dur-select {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
    padding: 6px 8px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .status-txt {
    font-size: 11px;
    color: var(--muted);
    min-height: 15px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="fluid"></canvas>
  </div>
</div>

<button id="reopenBtn" type="button" title="Ouvrir la télécommande">☰ Télécommande</button>

<div id="ctl">
  <div class="ctl-header">
    <div class="ctl-title"><span class="dot"></span>parcel</div>
    <button id="toggleCtl" class="icon-btn" type="button" title="Refermer la télécommande">▾ Réduire</button>
  </div>

  <div class="section">
    <div class="section-label">Animation en boucle</div>
    <div class="row">
      <button id="loopToggle" class="seg-btn active" type="button">Boucle : ON</button>
      <button id="newSeed" class="action-btn" type="button">Nouvelle boucle</button>
    </div>
    <label class="ctl-slider">
      <span>Vitesse</span>
      <input id="loopSpeed" type="range" min="0.2" max="2.5" step="0.05" value="1">
      <span id="loopSpeedV">1.00</span>
    </label>
  </div>

  <div class="section">
    <div class="section-label">Recadrage (PX)</div>
    <div class="row">
      <button class="seg-btn active" data-crop="auto" type="button">Auto</button>
      <button class="seg-btn" data-crop="1080x1920" type="button">1080×1920</button>
      <button class="seg-btn" data-crop="1920x1080" type="button">1920×1080</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Fluide</div>
    <label class="ctl-slider">
      <span>Taille</span>
      <input id="size" type="range" min="0.05" max="1" step="0.01" value="0.26">
      <span id="sizeV">0.26</span>
    </label>
    <label class="ctl-slider">
      <span>Dissipation</span>
      <input id="fade" type="range" min="0.2" max="6" step="0.1" value="1.6">
      <span id="fadeV">1.6</span>
    </label>
  </div>

  <div class="section">
    <div class="section-label">Export Vidéo</div>
    <div class="row">
      <button id="recordBtn" class="rec-btn" type="button">● Exporter Vidéo</button>
      <select id="recDuration" class="dur-select" title="Durée d'enregistrement">
        <option value="0">Manuel</option>
        <option value="5">5s</option>
        <option value="10" selected>10s</option>
        <option value="15">15s</option>
      </select>
    </div>
    <div id="recStatus" class="status-txt">Prêt (60 FPS WebM/MP4 selon navigateur)</div>
  </div>
</div>

<script>
window.addEventListener("load", () => {
  const canvas = document.getElementById("fluid");
  const frame = document.getElementById("frame");
  const ctl = document.getElementById("ctl");
  const reopenBtn = document.getElementById("reopenBtn");
  const toggleCtl = document.getElementById("toggleCtl");

  const config = {
    SIM_RESOLUTION: 128,
    DYE_RESOLUTION: 512,
    DENSITY_DISSIPATION: 1.6,
    VELOCITY_DISSIPATION: 1.6,
    PRESSURE: 0.1,
    PRESSURE_ITERATIONS: 16,
    CURL: 4.0,
    SPLAT_RADIUS: 0.26,
    SPLAT_FORCE: 6500,
    SHADING: true,
    COLOR_UPDATE_SPEED: 10,
    LOOP_ENABLED: true,
    LOOP_SPEED: 1.0,
    CROP_MODE: "auto"
  };

  ["pointerdown", "pointermove", "wheel", "touchstart"].forEach((ev) => {
    ctl.addEventListener(ev, (e) => e.stopPropagation());
    reopenBtn.addEventListener(ev, (e) => e.stopPropagation());
  });

  toggleCtl.addEventListener("click", () => {
    ctl.classList.add("collapsed");
    reopenBtn.classList.add("
